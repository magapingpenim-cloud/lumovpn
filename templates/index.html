{% extends "base.html" %}
{% block title %}FlankVPN — интернет без границ{% endblock %}
{% block content %}
<section class="home-poster" aria-label="FlankVPN — главная страница">
  <img
    class="home-poster-art"
    src="{{ url_for('static', filename='flankvpn-home-david-final.png') }}"
    alt="FlankVPN. Интернет без границ. Быстрый, безопасный и стабильный доступ. Давид в бирюзовых очках."
    width="941"
    height="1672"
    fetchpriority="high"
    decoding="async"
  >

  <details class="home-poster-menu">
    <summary aria-label="Открыть меню"></summary>
    <nav class="home-poster-menu-panel" aria-label="Меню FlankVPN">
      <a href="{{ url_for('index') }}">Главная</a>
      <a href="{{ url_for('tariffs') }}">Тарифы</a>
      <a href="{{ url_for('connection') }}">Подключение</a>
      <a href="{{ url_for('support') }}">Поддержка</a>
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('dashboard') }}">Моя подписка</a>
        <a href="{{ url_for('settings') }}">Настройки</a>
        <a href="{{ url_for('my_support') }}">Мои обращения</a>
        <form method="post" action="{{ url_for('logout') }}"><button type="submit">Выйти</button></form>
      {% else %}
        <a href="{{ url_for('login') }}">Войти</a>
        <a href="{{ url_for('register') }}">Регистрация</a>
      {% endif %}
    </nav>
  </details>

  <a class="home-poster-hotspot home-poster-brand" href="{{ url_for('index') }}" aria-label="FlankVPN — главная"></a>
  <a class="home-poster-hotspot home-poster-login" href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}" aria-label="{{ 'Открыть личный кабинет' if current_user.is_authenticated else 'Войти' }}"></a>
  <a class="home-poster-hotspot home-poster-start" href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('register') }}" aria-label="{{ 'Открыть личный кабинет' if current_user.is_authenticated else 'Начать бесплатно' }}"></a>
  <a class="home-poster-hotspot home-poster-tariffs" href="{{ url_for('tariffs') }}" aria-label="Тарифы"></a>
</section>
{% endblock %}
