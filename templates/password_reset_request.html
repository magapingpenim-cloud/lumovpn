{% extends "base.html" %}
{% block title %}Восстановление пароля — FlankVPN{% endblock %}
{% block content %}
<section class="auth auth-modern"><div class="auth-card card">
 <div class="eyebrow">FLANKVPN ACCOUNT</div><h1>Восстановление пароля</h1>
 <p class="muted auth-lead">Укажи email, с которым регистрировался. Мы отправим ссылку для смены пароля.</p>
 <form method="post" class="stack auth-form">
  <label>Email<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
  <button class="btn primary full">Отправить ссылку ↗</button>
 </form>
 <p class="tiny muted auth-switch"><a href="{{ url_for('login') }}">Вернуться ко входу</a></p>
</div></section>
{% endblock %}
