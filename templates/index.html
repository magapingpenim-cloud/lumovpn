{% extends "base.html" %}
{% block title %}FlankVPN — интернет без ограничений{% endblock %}
{% block content %}
<section class="home-page" aria-label="FlankVPN">
  <div class="home-visual">
    <img class="home-artwork" src="{{ url_for('static', filename='5C269ABB-B67E-471C-98ED-71D246689E6F.png') }}" alt="FlankVPN — интернет без ограничений" fetchpriority="high" decoding="async">
    {% if current_user.is_authenticated %}
      <a class="image-hotspot image-hotspot-login" href="{{ url_for('dashboard') }}" aria-label="Личный кабинет"></a>
      <a class="image-hotspot image-hotspot-start" href="{{ url_for('dashboard') }}" aria-label="Открыть личный кабинет"></a>
    {% else %}
      <a class="image-hotspot image-hotspot-login" href="{{ url_for('login') }}" aria-label="Войти"></a>
      <a class="image-hotspot image-hotspot-start" href="{{ url_for('register') }}" aria-label="Начать бесплатно"></a>
    {% endif %}
    <a class="image-hotspot image-hotspot-tariffs" href="{{ url_for('tariffs') }}" aria-label="Тарифы"></a>
  </div>
</section>
{% endblock %}
