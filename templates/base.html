<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09172b">
  <meta name="description" content="FlankVPN — простой личный кабинет, удобная подписка и быстрое подключение.">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='flankvpn-logo.svg') }}">
  <title>{% block title %}FlankVPN — свобода подключений{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="site-shell">
    <header class="nav">
      <a class="brand" href="{{ url_for('index') }}" aria-label="FlankVPN — главная">
        <img src="{{ url_for('static', filename='flankvpn-logo.svg') }}" alt="">
        <span>Flank<small>VPN</small></span>
      </a>
      <nav>
        {% if current_user.is_authenticated %}
          <a href="{{ url_for('dashboard') }}">Кабинет</a>
          <form class="inline" method="post" action="{{ url_for('logout') }}"><button class="navbutton" type="submit">Выйти</button></form>
        {% else %}
          <a href="{{ url_for('login') }}">Войти</a>
          <a class="navcta" href="{{ url_for('register') }}">Регистрация <span aria-hidden="true">↗</span></a>
        {% endif %}
      </nav>
    </header>
    <main class="container">
      {% with ms = get_flashed_messages(with_categories=true) %}
        {% for c, m in ms %}<div class="flash {{ c }}">{{ m }}</div>{% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
    <footer><span class="footer-brand">FLANKVPN</span><span>·</span><span>Просто подключиться.</span><span class="footer-year">© 2026</span></footer>
  </div>
</body>
</html>
