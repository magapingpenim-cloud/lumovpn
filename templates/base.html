<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}LumoVPN{% endblock %}</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><header class="nav"><a class="brand" href="{{url_for('index')}}"><img src="{{url_for('static',filename='lumovpn-logo.png')}}" alt=""><span>Lumo<small>VPN</small></span></a><nav>{% if current_user.is_authenticated %}<a href="{{url_for('dashboard')}}">Кабинет</a><form class="inline" method="post" action="{{url_for('logout')}}"><button class="navbutton">Выйти</button></form>{% else %}<a href="{{url_for('login')}}">Войти</a><a class="navcta" href="{{url_for('register')}}">Регистрация</a>{% endif %}</nav></header><main class="container">{% with ms=get_flashed_messages(with_categories=true) %}{% for c,m in ms %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer>© 2026 LumoVPN · Просто подключиться.</footer></body></html>
