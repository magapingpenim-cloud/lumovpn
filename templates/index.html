{% extends "base.html" %}
{% block title %}FlankVPN — интернет без ограничений{% endblock %}
{% block content %}
<section class="home-page" aria-label="FlankVPN">
  <div class="home-visual">
    <img class="home-artwork" src="{{ url_for('static', filename='5C269ABB-B67E-471C-98ED-71D246689E6F.png') }}" alt="FlankVPN — главная страница" fetchpriority="high" decoding="async">
  </div>
  <div class="home-actions">
    {% if current_user.is_authenticated %}
      <a class="home-primary-action" href="{{ url_for('dashboard') }}">Личный кабинет <span aria-hidden="true">↗</span></a>
    {% else %}
      <a class="home-primary-action" href="{{ url_for('register') }}">Начать бесплатно <span aria-hidden="true">↗</span></a>
      <a class="home-secondary-action" href="{{ url_for('login') }}">Войти</a>
    {% endif %}
  </div>
</section>
{% endblock %}
