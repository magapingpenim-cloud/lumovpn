{% extends "base.html" %}
{% block title %}FlankVPN — свободный интернет без ограничений{% endblock %}
{% block content %}
<div class="reference-stage" aria-label="FlankVPN — главная страница">
  <img class="reference-image" src="{{ url_for('static', filename='reference-home.webp') }}" alt="Главная страница FlankVPN">
  <a class="hotspot home-link" href="{{ url_for('index') }}" aria-label="Главная"></a>
  <a class="hotspot tariffs-link" href="#tariffs" aria-label="Тарифы"></a>
  <a class="hotspot connect-link" href="#connect" aria-label="Подключение"></a>
  <a class="hotspot support-link" href="{{ url_for('my_support') if current_user.is_authenticated else url_for('login') }}" aria-label="Поддержка"></a>
  <button class="hotspot theme-link" type="button" id="reference-theme" aria-label="Переключить тему"></button>
  <a class="hotspot login-link" href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}" aria-label="Войти"></a>
  <a class="hotspot trial-link" href="{{ url_for('register') if not current_user.is_authenticated else url_for('dashboard') }}" aria-label="Начать бесплатно"></a>
  <a class="hotspot tariff-button-link" href="#tariffs" aria-label="Посмотреть тарифы"></a>
</div>
<div class="reference-destinations" aria-hidden="true">
  <section id="tariffs"><h2>Тарифы</h2><a href="{{ url_for('index') }}">На главную</a></section>
  <section id="connect"><h2>Подключение</h2><a href="{{ url_for('index') }}">На главную</a></section>
</div>
<script>
(function(){
 const b=document.getElementById('reference-theme');
 if(!b)return;
 b.addEventListener('click',function(){
   const root=document.documentElement;
   root.dataset.theme=root.dataset.theme==='light'?'dark':'light';
 });
})();
</script>
{% endblock %}
