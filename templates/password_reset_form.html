{% extends "base.html" %}
{% block title %}Новый пароль — LumoVPN{% endblock %}
{% block content %}
<section class="auth auth-modern"><div class="auth-card card">
 <div class="eyebrow">LUMOVPN ACCOUNT</div><h1>Новый пароль</h1>
 <p class="muted auth-lead">Придумай новый пароль длиной не менее 8 символов.</p>
 <form method="post" class="stack auth-form">
  <label>Новый пароль<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
  <label>Повтори пароль<input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></label>
  <button class="btn primary full">Сохранить новый пароль ↗</button>
 </form>
</div></section>
{% endblock %}
